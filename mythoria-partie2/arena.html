<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../output.css">
</head>
<body>
    <!-- menu --> 
    <!-- play arena -->
     <div class="flex justify-around items-center">
        <h1 class="font-bold text-3xl  text-center">play arena</h1>
        <a href="../mythoria-partie1/deck.html" class=" text-xl block w-[70px] font-bold border-1 border-amber-50 rounded-2xl text-center bg-[#C8A96B]">back</a>
     </div>
    <main class="lg:w-[45%] flex flex-col mx-auto ">
        <section class="grid grid-cols-[1fr_0.3fr] gap-3">
            <!-- partie left -->
            <div id="partie-left" class="flex flex-col gap-2">
                <div id="cardboot" class=" grid grid-cols-5 gap-1">
                    <article class="h-25 border-3 border-[#C8A96B] rounded-[20px] shadow-[5px_0px_2px_2px_rgba(200,169,107,0.5)]"></article>
                    <article class="h-25  border-3 border-[#C8A96B] rounder-[20px] shadow-[5px_0px_2px_2px_rgba(200,169,107,0.5)]"></article>
                    <article class="h-25  border-3 border-[#C8A96B] rounder-[20px] shadow-[5px_0px_2px_2px_rgba(200,169,107,0.5)]"></article>
                    <article class="h-25  border-3 border-[#C8A96B] rounder-[20px] shadow-[5px_0px_2px_2px_rgba(200,169,107,0.5)]"></article>
                    <article class="h-25  border-3 border-[#C8A96B] rounder-[20px] shadow-[5px_0px_2px_2px_rgba(200,169,107,0.5)]"></article>
                </div>
                <div id="role_boot" class="h-5  rounded-[20px] bg-gray-500 mx-1 text-[black] text-center">
                </div>
                <div id="card_jouer_a" class=" grid grid-cols-5 ">
                    <article class="h-20  border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                </div>
                <div class="h-15 bg-[#100D18] border-1 rounded-[20px] flex  items-center justify-around">
                    <div id="psedo" class="text-[50px] text-amber-400"></div>
                    <div class="text-[50px] text-red-500">VS</div>
                    <div class="text-[50px] text-amber-400">BOOT</div>
                </div>

                <div id='card_jouer_b'  class="grid grid-cols-5">
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                    <article class="h-20 border-1"></article>
                </div>
                <!-- role de joueur -->
                <div id="role_player" class="h-5 rounded-[20px] bg-gray-500 mx-1 text-[black] text-center">
                </div>
                <div id="affichage_card" class=" grid grid-cols-5 gap-1">
                    <article class="h-25 id='1' border-3  border-[#C8A96B] rounded-[20px] shadow-[5px_0px_2px_2px_rgba(200,169,107,0.5)]"></article>
                    <article class="h-25 id='2' border-3  border-[#C8A96B] rounded-[20px] shadow-[5px_0px_2px_2px_rgba(200,169,107,0.5)]"></article>
                    <article class="h-25 id='3' border-3  border-[#C8A96B] rounded-[20px] shadow-[5px_0px_2px_2px_rgba(200,169,107,0.5)]"></article>
                    <article class="h-25 id='4' border-3  border-[#C8A96B] rounded-[20px] shadow-[5px_0px_2px_2px_rgba(200,169,107,0.5)]"></article>
                    <article class="h-25 id='5' border-3  border-[#C8A96B] rounded-[20px] shadow-[5px_0px_2px_2px_rgba(200,169,107,0.5)]"></article>
                </div>
            </div>
            <!-- partie right -->
            <div id="partie-right"
                class="h-full  border-3  rounder-[20px] flex justify-between flex-col rounded-[20px]">
                <div
                    class="h-60  border-3 rounded-[20px] w-[90%] mx-auto mt-1 flex flex-col items-center justify-center">
                    <div class="h-40"></div>
                    <div class="text-center text-[30px] "><span>3000 </span> <span>HP</span></div>
                    <div class="h-4   border-2 rounded-full w-[95%] text-center bg-gray-500 font-bold">
                        <div class="w-[100%] h-full rounded-full bg-red-500"></div>
                    </div>
                </div>
                <div>
                    <div id="start"
                        class="h-10 w-[50%] mx-auto border-3 rounded-[20px] text-center pt-1 bg-[#C8A96B] text-black font-bold cursor-pointer">
                        START
                    </div>
                    <div id="add"
                        class="h-10 w-[50%] mx-auto border-3 rounded-[20px] text-center pt-1 bg-[#C8A96B] text-black font-bold cursor-pointer">
                        add
                    </div>                    
                </div>
                <div class="flex justify-evenly mt-8">
                    <button id="defense"
                        class="h-10  border-3 rounded-[20px] w-[40%]  text-center pt-1 bg-[#C8A96B] text-black font-bold">defense</button>
                    <button
                        class="h-10  border-3 rounded-[20px] w-[40%]  text-center pt-1 bg-[#C8A96B] font-bold text-black ">attack</button>
                </div>
                <div class="h-60  border-3 rounded-[20px] w-[90%] mx-auto  flex flex-col items-center justify-center">
                    <div class="h-40"></div>
                    <div class="text-center text-[30px] "><span>3000 </span> <span>HP</span></div>
                    <div class="h-4   border-2 rounded-full w-[95%] text-center bg-gray-500 font-bold">
                        <div class=" w-[100%] rounded-full h-full bg-green-500"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <dialog id="dialog" class="m-auto rounded-2xl p-6 bg-amber-100 ">
    <form id="form" class="flex flex-col ">
        <label for="player_name">Enter your name</label>
        <input
            type="text"
            id="player_name"
            required
            minlength="2"
        >
        <button type="submit" >Confirm</button>
    </form>
    </dialog>
    <dialog id="dialog1" class="m-auto rounded-2xl p-6 bg-amber-100 ">
        <div>your role is <span id="role_dialog"></span></div>
    </dialog>
    <script type="module" src="../mythoria-partie1/data.js" defer></script>
    <script type="module" src="../mythoria-partie2/ui.js" defer></script>
    <!-- <script type="module" src="../mythoria-partie2/cards.js" defer></script>
    <script type="module" src="../mythoria-partie2/combat.js" defer></script> -->
    <script type="module" src="../mythoria-partie2/main.js" defer></script>
    <script type="module" src="../mythoria-partie2/opponent.js" defer></script>
    <!-- <script type="module" src="../mythoria-partie2/state.js" defer></script>
    <script type="module" src="../mythoria-partie2/turns.js" defer></script>
    <script type="module" src="../mythoria-partie2/utils.js" defer></script>
    <script type="module" src="../mythoria-partie2/cards.json" defer></script> -->
</body>
</html>
