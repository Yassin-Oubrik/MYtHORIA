
name: Deploy MYTHORIA

on:
  push:
    branches:
      - yassine
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p public
          cp -R mythoria-partie1 public/
          cp -R mythoria-partie2 public/
          cp output.css public/
          touch public/.nojekyll

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=./mythoria-partie1/">
            <title>MYTHORIA</title>
          </head>
          <body>
            <a href="./mythoria-partie1/">Entrer dans MYTHORIA</a>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
